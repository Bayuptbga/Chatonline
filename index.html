<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>DriveTok</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  html, body {
    height: 100%;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  
  #feed {
    height: 100vh;
    height: 100dvh;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
    scrollbar-width: none; /* Firefox */
  }
  #feed::-webkit-scrollbar { display: none; } /* Chrome */

  .video-slide {
    position: relative;
    height: 100vh;
    height: 100dvh;
    width: 100%;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  
  .video-slide video {
    height: 100%;
    width: 100%;
    object-fit: cover; /* Biar video memenuhi layar ala TikTok */
    background: #000;
  }

  .overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    padding: 20px 80px 20px 20px;
    background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
    color: #fff;
    z-index: 3;
    pointer-events: none;
  }
  
  .video-info { margin-bottom: 20px; }
  .video-info h3 {
    font-size: 16px;
    margin-bottom: 8px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }
  .video-info p {
    font-size: 14px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .side-actions {
    position: absolute;
    right: 12px;
    bottom: 40px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    z-index: 4;
  }
  
  .action-btn {
    background: transparent;
    color: white;
    border: none;
    font-size: 32px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: transform 0.2s;
    gap: 4px;
  }
  .action-btn span {
    font-size: 12px;
    font-weight: 600;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
  }
  .action-btn:active { transform: scale(0.9); }
  .liked { color: #fe2c55; }

  .tap-zone { position: absolute; inset: 0; z-index: 2; }

  /* Animasi Love pas Double Tap */
  .heart-pop {
    position: absolute;
    color: #fe2c55;
    font-size: 80px;
    opacity: 0;
    transform: scale(0) rotate(-15deg);
    pointer-events: none;
    z-index: 10;
    transition: all 0.5s ease-out;
  }
  .heart-pop.animate {
    opacity: 1;
    transform: scale(1) rotate(0deg);
  }
  .heart-pop.fade {
    opacity: 0;
    transform: scale(1.5) translateY(-50px);
  }

  #topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    padding: 14px 16px;
    color: #fff;
    font-weight: 700;
    font-size: 18px;
    text-align: center;
    z-index: 10;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    pointer-events: none;
  }
  
  #status {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    text-align: center;
    padding: 24px;
    font-size: 15px;
    line-height: 1.6;
    z-index: 20;
    background: rgba(0,0,0,0.8);
  }
  #status.hidden { display: none; }
  
  .spinner {
    width: 34px;
    height: 34px;
    border: 3px solid rgba(255,255,255,0.25);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="topbar">DriveTok</div>
<div id="feed"></div>

<div id="status">
  <div>
    <div class="spinner"></div>
    <div id="status-text">Memuat video...</div>
  </div>
</div>

<script src="config.js"></script>
<script>
(function () {
  const feedEl = document.getElementById('feed');
  const statusEl = document.getElementById('status');
  const statusText = document.getElementById('status-text');

  let nextPageToken = null;
  let loading = false;
  let allLoaded = false;
  const likedSet = new Set();
  let folderQueryClause = null;

  function showStatus(html) {
    statusEl.classList.remove('hidden');
    statusText.innerHTML = html;
  }
  function hideStatus() {
    statusEl.classList.add('hidden');
  }

  async function discoverAllFolderIds(rootId) {
    const allIds = [rootId];
    const queue = [rootId];
    const MAX_FOLDERS = 300; 
    while (queue.length > 0 && allIds.length < MAX_FOLDERS) {
      const currentId = queue.shift();
      let pageToken = null;
      do {
        const params = new URLSearchParams({
          q: `'${currentId}' in parents and mimeType = 'application/vnd.google-apps.folder' and trashed = false`,
          fields: 'nextPageToken, files(id)',
          pageSize: '100',
          key: CONFIG.API_KEY,
        });
        if (pageToken) params.set('pageToken', pageToken);
        const res = await fetch(`https://www.googleapis.com/drive/v3/files?${params.toString()}`);
        const data = await res.json();
        if (data.error) throw new Error(data.error.message || 'Gagal menelusuri subfolder');
        (data.files || []).forEach((f) => {
          allIds.push(f.id);
          queue.push(f.id);
        });
        pageToken = data.nextPageToken || null;
      } while (pageToken);
    }
    return allIds;
  }

  async function fetchVideoList() {
    if (loading || allLoaded) return;
    loading = true;
    
    if (!folderQueryClause) {
      try {
        showStatus('Menelusuri folder & subfolder...');
        const folderIds = await discoverAllFolderIds(CONFIG.FOLDER_ID);
        folderQueryClause = '(' + folderIds.map((id) => `'${id}' in parents`).join(' or ') + ')';
      } catch (err) {
        showStatus(`⚠️ Gagal menelusuri subfolder.<br><br>${err.message}`);
        loading = false;
        return;
      }
    }

    const params = new URLSearchParams({
      q: `${folderQueryClause} and mimeType contains 'video/' and trashed = false`,
      fields: 'nextPageToken, files(id, name, mimeType)',
      pageSize: String(CONFIG.PAGE_SIZE),
      key: CONFIG.API_KEY,
    });
    if (nextPageToken) params.set('pageToken', nextPageToken);

    try {
      const res = await fetch(`https://www.googleapis.com/drive/v3/files?${params.toString()}`);
      const data = await res.json();
      
      if (data.error) throw new Error(data.error.message);

      const files = data.files || [];
      nextPageToken = data.nextPageToken || null;
      if (!nextPageToken) allLoaded = true;

      hideStatus();
      files.forEach(renderSlide);
    } catch (err) {
      showStatus(`⚠️ Terjadi kesalahan.<br><br>${err.message}`);
    }
    loading = false;
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function renderSlide(file) {
    const slide = document.createElement('div');
    slide.className = 'video-slide';
    slide.dataset.fileId = file.id;

    const src = `https://drive.google.com/uc?export=download&id=${file.id}`;

    slide.innerHTML = `
      <video src="${src}" loop muted playsinline preload="metadata"></video>
      <div class="tap-zone"></div>
      <div class="heart-pop">❤️</div>
      
      <div class="side-actions">
        <button class="action-btn like-btn">${likedSet.has(file.id) ? '❤️' : '🤍'}<span>Suka</span></button>
        <button class="action-btn mute-btn">🔇<span>Suara</span></button>
        <button class="action-btn">↗️<span>Bagikan</span></button>
      </div>
      
      <div class="overlay">
        <div class="video-info">
          <h3>@drivetok_user</h3>
          <p>${escapeHtml(file.name)}</p>
        </div>
      </div>
    `;

    const video = slide.querySelector('video');
    const tapZone = slide.querySelector('.tap-zone');
    const likeBtn = slide.querySelector('.like-btn');
    const muteBtn = slide.querySelector('.mute-btn');
    const heartPop = slide.querySelector('.heart-pop');

    // Double Tap Logic dengan Animasi
    let lastTap = 0;
    tapZone.addEventListener('click', (e) => {
      const currentTime = new Date().getTime();
      const tapInterval = currentTime - lastTap;
      
      if (tapInterval < 300) {
        // Double Tap Terdeteksi
        if (!likedSet.has(file.id)) {
          likedSet.add(file.id);
          likeBtn.innerHTML = '❤️<span>Suka</span>';
          likeBtn.classList.add('liked');
        }
        
        // Animasi Hati Muncul
        const rect = tapZone.getBoundingClientRect();
        const x = e.clientX - rect.left - 40; 
        const y = e.clientY - rect.top - 40;
        heartPop.style.left = `${x}px`;
        heartPop.style.top = `${y}px`;
        
        heartPop.classList.remove('fade');
        heartPop.classList.add('animate');
        
        setTimeout(() => {
          heartPop.classList.remove('animate');
          heartPop.classList.add('fade');
        }, 500);

      } else {
        // Single Tap Terdeteksi (Play/Pause)
        // Gunakan timeout untuk mencegah pause kalau user ternyata double tap
        setTimeout(() => {
          if (currentTime === lastTap) { 
            video.paused ? video.play() : video.pause();
          }
        }, 300);
      }
      lastTap = currentTime;
    });

    likeBtn.addEventListener('click', () => {
      const isLiked = likedSet.has(file.id);
      if (isLiked) { 
        likedSet.delete(file.id); 
        likeBtn.innerHTML = '🤍<span>Suka</span>';
        likeBtn.classList.remove('liked'); 
      } else { 
        likedSet.add(file.id); 
        likeBtn.innerHTML = '❤️<span>Suka</span>';
        likeBtn.classList.add('liked'); 
      }
    });

    muteBtn.addEventListener('click', () => {
      video.muted = !video.muted;
      muteBtn.innerHTML = video.muted ? '🔇<span>Bisu</span>' : '🔊<span>Suara</span>';
    });

    // Fallback kalau video ditolak API Gdrive
    video.addEventListener('error', () => {
      slide.innerHTML = `
        <iframe src="https://drive.google.com/file/d/${file.id}/preview"
          style="width:100%;height:100%;border:0;" allow="autoplay"></iframe>
        <div class="overlay">
          <div class="video-info">
            <h3>@drivetok_user</h3>
            <p>${escapeHtml(file.name)}</p>
          </div>
        </div>
      `;
    });

    feedEl.appendChild(slide);
    observer.observe(slide);
  }

  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      const video = entry.target.querySelector('video');
      if (!video) return;
      if (entry.isIntersecting && entry.intersectionRatio > 0.6) {
        video.play().catch(() => {});
      } else {
        video.pause();
      }
    });

    const slides = feedEl.children;
    if (slides.length > 0) {
      const lastSlide = slides[slides.length - 1];
      const lastRect = lastSlide.getBoundingClientRect();
      if (lastRect.top < window.innerHeight * 2) {
        fetchVideoList();
      }
    }
  }, { threshold: [0, 0.6, 1] });

  // Pengecekan Config
  if (!CONFIG.API_KEY || CONFIG.API_KEY.startsWith('ISI_') ||
      !CONFIG.FOLDER_ID || CONFIG.FOLDER_ID.startsWith('ISI_')) {
    showStatus('⚙️ Konfigurasi belum diisi. Periksa config.js');
  } else {
    fetchVideoList();
  }
})();
</script>
</body>
</html>
