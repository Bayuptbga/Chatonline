<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>DriveTok v9</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  html, body {
    height: 100%;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  
  #feed {
    height: 100vh;
    height: 100dvh;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
    scrollbar-width: none;
  }
  #feed::-webkit-scrollbar { display: none; }

  .video-slide {
    position: relative;
    height: 100vh;
    height: 100dvh;
    width: 100%;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  
  .video-slide video {
    height: 100%;
    width: 100%;
    object-fit: cover;
    background: #000;
  }

  .overlay {
    position: absolute;
    bottom: 60px;
    left: 0;
    width: 100%;
    padding: 30px 80px 20px 16px;
    background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
    color: #fff;
    z-index: 3;
    pointer-events: none;
  }
  
  .video-info { margin-bottom: 10px; }
  .video-info h3 {
    font-size: 16px;
    margin-bottom: 8px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
  }
  .video-info p {
    font-size: 14px;
    line-height: 1.4;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .side-actions {
    position: absolute;
    right: 12px;
    bottom: 80px; 
    display: flex;
    flex-direction: column;
    gap: 22px;
    z-index: 4;
  }
  
  .action-btn {
    background: transparent;
    color: white;
    border: none;
    font-size: 34px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: transform 0.2s;
    gap: 4px;
  }
  .action-btn span {
    font-size: 12px;
    font-weight: 600;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
  }
  .action-btn:active { transform: scale(0.9); }
  .liked { color: #fe2c55; }

  .tap-zone { position: absolute; inset: 0; z-index: 2; cursor: pointer; }

  .heart-pop {
    position: absolute;
    color: #fe2c55;
    font-size: 80px;
    opacity: 0;
    transform: scale(0) rotate(-15deg);
    pointer-events: none;
    z-index: 10;
    transition: all 0.5s ease-out;
  }
  .heart-pop.animate {
    opacity: 1;
    transform: scale(1) rotate(0deg);
  }
  .heart-pop.fade {
    opacity: 0;
    transform: scale(1.5) translateY(-50px);
  }

  #topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    padding: 20px 16px 14px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    z-index: 10;
    background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
  }
  
  .top-tab {
    color: rgba(255, 255, 255, 0.7);
    font-weight: 600;
    font-size: 16px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    cursor: pointer;
    transition: all 0.2s;
  }
  .top-tab.active {
    color: #fff;
    font-size: 17px;
    position: relative;
  }
  .top-tab.active::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 24px;
    height: 3px;
    background: #fff;
    border-radius: 2px;
  }

  #bottom-navbar {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 60px;
    background: #000;
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 50;
    border-top: 1px solid rgba(255, 255, 255, 0.15);
  }
  .nav-item {
    color: rgba(255, 255, 255, 0.6);
    font-size: 10px;
    font-weight: 600;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    flex: 1;
  }
  .nav-item.active { color: #fff; }
  .nav-icon { width: 24px; height: 24px; fill: currentColor; }
  
  .nav-add-wrapper { display: flex; align-items: center; justify-content: center; flex: 1; }
  .nav-add-btn {
    width: 42px; height: 28px; background: #fff; border-radius: 8px;
    display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer;
  }
  .nav-add-btn::before { content: ''; position: absolute; width: 100%; height: 100%; background: #20D5EC; left: -4px; border-radius: 8px; z-index: -1; }
  .nav-add-btn::after { content: ''; position: absolute; width: 100%; height: 100%; background: #FE2C55; right: -4px; border-radius: 8px; z-index: -2; }
  .nav-add-btn svg { fill: #000; width: 18px; height: 18px; }
  
  #status {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #fff; text-align: center; padding: 24px; font-size: 15px; line-height: 1.6;
    z-index: 20; background: rgba(0,0,0,0.8);
  }
  #status.hidden { display: none; }
  
  .spinner {
    width: 34px; height: 34px; border: 3px solid rgba(255,255,255,0.25);
    border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  
  .error-msg {
    color: white; display: flex; align-items: center; justify-content: center; 
    height: 100%; text-align: center; padding: 20px; background: #111;
  }
</style>
</head>
<body>

<div id="topbar">
  <span class="top-tab" onclick="alert('Fitur Mengikuti akan segera hadir!')">Mengikuti</span>
  <span class="top-tab active">Untuk Anda</span>
</div>
<div id="feed"></div>

<div id="bottom-navbar">
  <div class="nav-item active">
    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 3L4 9v12h5v-7h6v7h5V9z"/></svg><span>Beranda</span>
  </div>
  <div class="nav-item">
    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg><span>Teman</span>
  </div>
  <div class="nav-add-wrapper"><div class="nav-add-btn"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></div></div>
  <div class="nav-item">
    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg><span>Kotak Masuk</span>
  </div>
  <div class="nav-item">
    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><span>Profil</span>
  </div>
</div>

<div id="status">
  <div>
    <div class="spinner"></div>
    <div id="status-text">Memuat video...</div>
  </div>
</div>

<script src="config.js"></script>
<script>
(function () {
  const feedEl = document.getElementById('feed');
  const statusEl = document.getElementById('status');
  const statusText = document.getElementById('status-text');

  let loading = false;
  let allLoaded = false;
  const likedSet = new Set();
  
  // STATE ALGORITMA FYP RANDOM
  let activeFolders = [];       
  let folderTokens = {};        
  let foldersDiscovered = false;

  function showStatus(html) {
    statusEl.classList.remove('hidden');
    statusText.innerHTML = html;
  }
  function hideStatus() {
    statusEl.classList.add('hidden');
  }

  function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  async function discoverAllFolderIds(rootId) {
    const allIds = [rootId];
    const queue = [rootId];
    const MAX_FOLDERS = 150; 
    while (queue.length > 0 && allIds.length < MAX_FOLDERS) {
      const currentId = queue.shift();
      let pageToken = null;
      do {
        const params = new URLSearchParams({
          q: `'${currentId}' in parents and mimeType = 'application/vnd.google-apps.folder' and trashed = false`,
          fields: 'nextPageToken, files(id)',
          pageSize: '100',
          key: CONFIG.API_KEY,
        });
        if (pageToken) params.set('pageToken', pageToken);
        const res = await fetch(`https://www.googleapis.com/drive/v3/files?${params.toString()}`);
        const data = await res.json();
        if (data.error) throw new Error(data.error.message);
        (data.files || []).forEach((f) => {
          allIds.push(f.id);
          queue.push(f.id);
        });
        pageToken = data.nextPageToken || null;
      } while (pageToken);
    }
    return allIds;
  }

  async function fetchVideoList() {
    if (loading || allLoaded) return;
    loading = true;
    
    if (!foldersDiscovered) {
      showStatus('Menyiapkan algoritma Beranda (FYP)...');
      let rootIds = [];
      if (CONFIG.FOLDER_IDS && Array.isArray(CONFIG.FOLDER_IDS)) {
        rootIds = rootIds.concat(CONFIG.FOLDER_IDS);
      } else if (CONFIG.FOLDER_ID) {
        rootIds.push(CONFIG.FOLDER_ID);
      }

      for (let i = 0; i < rootIds.length; i++) {
        try {
          const subfolders = await discoverAllFolderIds(rootIds[i]);
          activeFolders = activeFolders.concat(subfolders);
        } catch (err) {
          console.error("Gagal menelusuri root folder:", rootIds[i], err);
        }
      }
      
      activeFolders = [...new Set(activeFolders)];
      
      activeFolders.forEach(id => { folderTokens[id] = null; });
      foldersDiscovered = true;
      
      if(activeFolders.length === 0) {
         showStatus('⚠️ Gagal mendapatkan folder. Pastikan ID folder di config.js valid.');
         loading = false;
         return;
      }
    }

    if (activeFolders.length === 0) {
      allLoaded = true;
      loading = false;
      return;
    }

    const randomFolderIndex = Math.floor(Math.random() * activeFolders.length);
    const selectedFolderId = activeFolders[randomFolderIndex];
    const pageToken = folderTokens[selectedFolderId];

    const params = new URLSearchParams({
      q: `'${selectedFolderId}' in parents and mimeType contains 'video/' and trashed = false`,
      fields: 'nextPageToken, files(id, name, mimeType)',
      pageSize: String(CONFIG.PAGE_SIZE || 10),
      key: CONFIG.API_KEY,
    });
    
    if (pageToken) params.set('pageToken', pageToken);

    try {
      const res = await fetch(`https://www.googleapis.com/drive/v3/files?${params.toString()}`);
      const data = await res.json();
      
      if (data.error) throw new Error(data.error.message);

      let files = data.files || [];

      if (data.nextPageToken) {
        folderTokens[selectedFolderId] = data.nextPageToken;
      } else {
        activeFolders.splice(randomFolderIndex, 1);
      }

      if (files.length === 0) {
        loading = false;
        return fetchVideoList(); 
      }

      files = shuffleArray(files);
      hideStatus();
      files.forEach(renderSlide);

    } catch (err) {
      console.error("Folder dilewati karena error:", selectedFolderId, err);
      activeFolders.splice(randomFolderIndex, 1);
      loading = false;
      return fetchVideoList(); 
    }

    loading = false;
  }

  function escapeHtml(str) {
    const d = document.createElement('div'); d.textContent = str; return d.innerHTML;
  }

  function renderSlide(file) {
    const slide = document.createElement('div');
    slide.className = 'video-slide';
    slide.dataset.fileId = file.id;

    const src = `https://www.googleapis.com/drive/v3/files/${file.id}?alt=media&key=${CONFIG.API_KEY}`;

    slide.innerHTML = `
      <video data-src="${src}" loop muted playsinline preload="none"></video>
      <div class="tap-zone"></div>
      <div class="heart-pop">❤️</div>
      
      <div class="side-actions">
        <button class="action-btn like-btn">${likedSet.has(file.id) ? '❤️' : '🤍'}<span>Suka</span></button>
        <button class="action-btn mute-btn">🔇<span>Suara</span></button>
        <button class="action-btn">↗️<span>Bagikan</span></button>
      </div>
      
      <div class="overlay">
        <div class="video-info">
          <h3>@user_${file.id.substring(0,5).toLowerCase()}</h3>
          <p>${escapeHtml(file.name)}</p>
        </div>
      </div>
    `;

    const video = slide.querySelector('video');
    const tapZone = slide.querySelector('.tap-zone');
    const likeBtn = slide.querySelector('.like-btn');
    const muteBtn = slide.querySelector('.mute-btn');
    const heartPop = slide.querySelector('.heart-pop');

    let lastTap = 0;
    tapZone.addEventListener('click', (e) => {
      const currentTime = new Date().getTime();
      const tapInterval = currentTime - lastTap;
      
      if (tapInterval < 300) {
        if (!likedSet.has(file.id)) {
          likedSet.add(file.id);
          likeBtn.innerHTML = '❤️<span>Suka</span>';
          likeBtn.classList.add('liked');
        }
        
        const rect = tapZone.getBoundingClientRect();
        heartPop.style.left = `${e.clientX - rect.left - 40}px`;
        heartPop.style.top = `${e.clientY - rect.top - 40}px`;
        heartPop.classList.remove('fade');
        heartPop.classList.add('animate');
        setTimeout(() => {
          heartPop.classList.remove('animate');
          heartPop.classList.add('fade');
        }, 500);
      } else {
        setTimeout(() => {
          if (currentTime === lastTap) { 
            // Jika video adalah iframe, play/pause via JS tidak didukung
            if(video.tagName.toLowerCase() === 'video') {
                video.paused ? video.play() : video.pause(); 
            }
          }
        }, 300);
      }
      lastTap = currentTime;
    });

    likeBtn.addEventListener('click', () => {
      const isLiked = likedSet.has(file.id);
      if (isLiked) { 
        likedSet.delete(file.id); likeBtn.innerHTML = '🤍<span>Suka</span>'; likeBtn.classList.remove('liked'); 
      } else { 
        likedSet.add(file.id); likeBtn.innerHTML = '❤️<span>Suka</span>'; likeBtn.classList.add('liked'); 
      }
    });
    
    muteBtn.addEventListener('click', () => {
      if(video.tagName.toLowerCase() === 'video') {
          video.muted = !video.muted; 
          muteBtn.innerHTML = video.muted ? '🔇<span>Bisu</span>' : '🔊<span>Suara</span>';
      }
    });

    // Jika video gagal dimuat, hapus slide ini dari feed (skip, tanpa iframe)
    video.addEventListener('error', () => {
       console.log("Video gagal dimuat, slide dilewati:", file.id);
       observer.unobserve(slide);
       preloadObserver.unobserve(slide);
       slide.remove();
    });

    feedEl.appendChild(slide);
    observer.observe(slide);
    preloadObserver.observe(slide);
  }

  // Load/unload src video hanya untuk slide aktif + 1 slide di sekitarnya,
  // supaya nggak semua video ke-request sekaligus (hemat bandwidth & API quota)
  function loadVideo(video) {
    if (!video.src && video.dataset.src) {
      video.src = video.dataset.src;
      video.load();
    }
  }
  function unloadVideo(video) {
    if (video.src) {
      video.pause();
      video.removeAttribute('src');
      video.load();
    }
  }

  const preloadObserver = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      const video = entry.target.querySelector('video');
      if (!video) return;
      if (entry.isIntersecting) {
        loadVideo(video);
      } else {
        unloadVideo(video);
      }
    });
  }, { rootMargin: '100% 0px 100% 0px', threshold: 0 });

  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      const video = entry.target.querySelector('video');
      if (!video) return;
      if (entry.isIntersecting && entry.intersectionRatio > 0.6) {
        video.play().catch(() => {});
      } else {
        video.pause();
      }
    });
    const slides = feedEl.children;
    if (slides.length > 0) {
      const lastSlide = slides[slides.length - 1];
      if (lastSlide.getBoundingClientRect().top < window.innerHeight * 2) {
        fetchVideoList();
      }
    }
  }, { threshold: [0, 0.6, 1] });

  const hasFolderId = CONFIG.FOLDER_ID && !CONFIG.FOLDER_ID.startsWith('ISI_');
  const hasFolderIds = CONFIG.FOLDER_IDS && Array.isArray(CONFIG.FOLDER_IDS) && CONFIG.FOLDER_IDS.length > 0;
  
  if (!CONFIG.API_KEY || CONFIG.API_KEY.startsWith('ISI_') || (!hasFolderId && !hasFolderIds)) {
    showStatus('⚙️ Konfigurasi belum diisi. Periksa config.js');
  } else {
    fetchVideoList();
  }
})();
</script>
</body>
</html>
