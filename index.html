<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>DriveTok v9</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  html, body {
    height: 100%;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  
  #feed {
    height: 100vh;
    height: 100dvh;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
    scrollbar-width: none;
  }
  #feed::-webkit-scrollbar { display: none; }

  .video-slide {
    position: relative;
    height: 100vh;
    height: 100dvh;
    width: 100%;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  
  .video-slide video {
    height: 100%;
    width: 100%;
    object-fit: cover;
    background: #000;
  }

  .overlay {
    position: absolute;
    bottom: 60px;
    left: 0;
    width: 100%;
    padding: 30px 80px 20px 16px;
    background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
    color: #fff;
    z-index: 3;
    pointer-events: none;
  }
  
  .video-info { margin-bottom: 10px; }
  .video-info h3 {
    font-size: 16px;
    margin-bottom: 8px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
  }
  .video-info p {
    font-size: 14px;
    line-height: 1.4;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .side-actions {
    position: absolute;
    right: 12px;
    bottom: 80px; 
    display: flex;
    flex-direction: column;
    gap: 22px;
    z-index: 4;
  }
  
  .action-btn {
    background: transparent;
    color: white;
    border: none;
    font-size: 34px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: transform 0.2s;
    gap: 4px;
  }
  .action-btn span {
    font-size: 12px;
    font-weight: 600;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
  }
  .action-btn:active { transform: scale(0.9); }
  .liked { color: #fe2c55; }

  .tap-zone { position: absolute; inset: 0; z-index: 2; cursor: pointer; }

  .heart-pop {
    position: absolute;
    color: #fe2c55;
    font-size: 80px;
    opacity: 0;
    transform: scale(0) rotate(-15deg);
    pointer-events: none;
    z-index: 10;
    transition: all 0.5s ease-out;
  }
  .heart-pop.animate {
    opacity: 1;
    transform: scale(1) rotate(0deg);
  }
  .heart-pop.fade {
    opacity: 0;
    transform: scale(1.5) translateY(-50px);
  }

  #topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    padding: 20px 16px 14px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    z-index: 10;
    background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
  }
  
  .top-tab {
    color: rgba(255, 255, 255, 0.7);
    font-weight: 600;
    font-size: 16px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    cursor: pointer;
    transition: all 0.2s;
  }
  .top-tab.active {
    color: #fff;
    font-size: 17px;
    position: relative;
  }
  .top-tab.active::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 24px;
    height: 3px;
    background: #fff;
    border-radius: 2px;
  }

  #bottom-navbar {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 60px;
    background: #000;
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 50;
    border-top: 1px solid rgba(255, 255, 255, 0.15);
  }
  .nav-item {
    color: rgba(255, 255, 255, 0.6);
    font-size: 10px;
    font-weight: 600;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    flex: 1;
  }
  .nav-item.active { color: #fff; }
  .nav-icon { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  
  .nav-add-wrapper { display: flex; align-items: center; justify-content: center; flex: 1; }
  .nav-add-btn {
    width: 44px; height: 30px; background: #fff; border-radius: 10px;
    display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer;
  }
  .nav-add-btn::before { content: ''; position: absolute; width: 100%; height: 100%; background: #7C4DFF; left: -4px; border-radius: 10px; z-index: -1; }
  .nav-add-btn::after { content: ''; position: absolute; width: 100%; height: 100%; background: #FF9100; right: -4px; border-radius: 10px; z-index: -2; }
  .nav-add-btn svg { fill: #000; width: 18px; height: 18px; }
  
  #status {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #fff; text-align: center; padding: 24px; font-size: 15px; line-height: 1.6;
    z-index: 20; background: rgba(0,0,0,0.8);
  }
  #status.hidden { display: none; }
  
  .spinner {
    width: 34px; height: 34px; border: 3px solid rgba(255,255,255,0.25);
    border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  
  .error-msg {
    color: white; display: flex; align-items: center; justify-content: center; 
    height: 100%; text-align: center; padding: 20px; background: #111;
  }
</style>
</head>
<body>

<div id="topbar">
  <span class="top-tab" onclick="alert('Fitur Mengikuti akan segera hadir!')">Mengikuti</span>
  <span class="top-tab active">Untuk Anda</span>
</div>
<div id="feed"></div>

<div id="bottom-navbar">
  <div class="nav-item active">
    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg><span>Beranda</span>
  </div>
  <div class="nav-item">
    <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M4 20c0-3 2.5-5 5-5s5 2 5 5"/><circle cx="17" cy="9" r="2.3"/><path d="M14.5 20c.3-2.2 1.7-3.6 3-4"/></svg><span>Teman</span>
  </div>
  <div class="nav-add-wrapper"><div class="nav-add-btn"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></div></div>
  <div class="nav-item">
    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg><span>Kotak Masuk</span>
  </div>
  <div class="nav-item">
    <svg class="nav-icon" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="12" cy="10" r="3"/><path d="M7 19c.7-2.5 2.7-4 5-4s4.3 1.5 5 4"/></svg><span>Profil</span>
  </div>
</div>

<div id="status">
  <div>
    <div class="spinner"></div>
    <div id="status-text">Memuat video...</div>
  </div>
</div>

<script src="config.js"></script>
<script>
(function () {
  const feedEl = document.getElementById('feed');
  const statusEl = document.getElementById('status');
  const statusText = document.getElementById('status-text');

  let loading = false;
  let allLoaded = false;
  const likedSet = new Set();
  let audioUnlocked = false; // true setelah user berinteraksi pertama kali (scroll/tap)

  // Begitu user berinteraksi pertama kali, nyalakan suara video yang lagi aktif
  function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    const activeVideo = feedEl.querySelector('.video-slide video');
    document.querySelectorAll('.video-slide').forEach((slide) => {
      const rect = slide.getBoundingClientRect();
      const video = slide.querySelector('video');
      const muteBtn = slide.querySelector('.mute-btn');
      if (video && rect.top < window.innerHeight * 0.6 && rect.bottom > window.innerHeight * 0.4) {
        video.muted = false;
        if (muteBtn) muteBtn.innerHTML = '🔊<span>Suara</span>';
      }
    });
  }
  feedEl.addEventListener('scroll', unlockAudio, { once: true, passive: true });
  document.addEventListener('touchstart', unlockAudio, { once: true, passive: true });
  document.addEventListener('click', unlockAudio, { once: true });
  
  // STATE ALGORITMA FYP RANDOM
  let activeFolders = [];       
  let foldersDiscovered = false;
  let videoQueue = [];             // antrian video yang sudah diacak, siap ditampilkan
  let backgroundBuildDone = false; // apakah semua folder sudah selesai di-scan
  let firstBatchRendered = false;  // apakah batch pertama sudah ditampilkan

  function showStatus(html) {
    statusEl.classList.remove('hidden');
    statusText.innerHTML = html;
  }
  function hideStatus() {
    statusEl.classList.add('hidden');
  }

  function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  async function discoverAllFolderIds(rootId) {
    const allIds = [rootId];
    const queue = [rootId];
    const MAX_FOLDERS = 150; 
    while (queue.length > 0 && allIds.length < MAX_FOLDERS) {
      const currentId = queue.shift();
      let pageToken = null;
      do {
        const params = new URLSearchParams({
          q: `'${currentId}' in parents and mimeType = 'application/vnd.google-apps.folder' and trashed = false`,
          fields: 'nextPageToken, files(id)',
          pageSize: '100',
          key: CONFIG.API_KEY,
        });
        if (pageToken) params.set('pageToken', pageToken);
        const res = await fetch(`https://www.googleapis.com/drive/v3/files?${params.toString()}`);
        const data = await res.json();
        if (data.error) throw new Error(data.error.message);
        (data.files || []).forEach((f) => {
          allIds.push(f.id);
          queue.push(f.id);
        });
        pageToken = data.nextPageToken || null;
      } while (pageToken);
    }
    return allIds;
  }

  // Ambil SEMUA video dari satu folder (paginasi penuh), tanpa render dulu
  async function fetchAllVideosInFolder(folderId) {
    const files = [];
    let pageToken = null;
    do {
      const params = new URLSearchParams({
        q: `'${folderId}' in parents and mimeType contains 'video/' and trashed = false`,
        fields: 'nextPageToken, files(id, name, mimeType)',
        pageSize: '1000',
        key: CONFIG.API_KEY,
      });
      if (pageToken) params.set('pageToken', pageToken);
      const res = await fetch(`https://www.googleapis.com/drive/v3/files?${params.toString()}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error.message);
      files.push(...(data.files || []));
      pageToken = data.nextPageToken || null;
    } while (pageToken);
    return files;
  }

  function renderNextBatch() {
    const batchSize = CONFIG.PAGE_SIZE || 10;
    const batch = videoQueue.splice(0, batchSize);
    if (batch.length > 0) {
      hideStatus();
      batch.forEach(renderSlide);
    }
    if (videoQueue.length === 0 && backgroundBuildDone) {
      allLoaded = true;
    }
  }

  // Scan tiap folder satu-satu, dan begitu ada hasil langsung ditampilkan
  // (nggak nunggu SEMUA folder selesai) — sisanya lanjut nge-scan di background.
  async function buildQueueInBackground() {
    for (let i = 0; i < activeFolders.length; i++) {
      try {
        const files = await fetchAllVideosInFolder(activeFolders[i]);
        if (files.length > 0) {
          videoQueue = shuffleArray(videoQueue.concat(files));
          if (!firstBatchRendered) {
            firstBatchRendered = true;
            renderNextBatch();
          }
        }
      } catch (err) {
        console.error("Folder dilewati karena error:", activeFolders[i], err);
      }
    }
    backgroundBuildDone = true;

    if (videoQueue.length === 0 && !firstBatchRendered) {
      showStatus('⚠️ Tidak ada video ditemukan di folder yang dikonfigurasi.');
      allLoaded = true;
    }
  }

  async function fetchVideoList() {
    if (loading || allLoaded) return;
    loading = true;
    
    if (!foldersDiscovered) {
      showStatus('Menyiapkan algoritma Beranda (FYP)...');
      let rootIds = [];
      if (CONFIG.FOLDER_IDS && Array.isArray(CONFIG.FOLDER_IDS)) {
        rootIds = rootIds.concat(CONFIG.FOLDER_IDS);
      } else if (CONFIG.FOLDER_ID) {
        rootIds.push(CONFIG.FOLDER_ID);
      }

      for (let i = 0; i < rootIds.length; i++) {
        try {
          const subfolders = await discoverAllFolderIds(rootIds[i]);
          activeFolders = activeFolders.concat(subfolders);
        } catch (err) {
          console.error("Gagal menelusuri root folder:", rootIds[i], err);
        }
      }
      
      activeFolders = [...new Set(activeFolders)];
      foldersDiscovered = true;
      
      if(activeFolders.length === 0) {
         showStatus('⚠️ Gagal mendapatkan folder. Pastikan ID folder di config.js valid.');
         loading = false;
         return;
      }

      showStatus('Mengacak video...');
      buildQueueInBackground(); // tidak di-await, jalan di background
    }

    if (videoQueue.length > 0) {
      renderNextBatch();
    } else if (backgroundBuildDone) {
      allLoaded = true;
    }
    // kalau queue masih kosong tapi background build belum selesai,
    // biarin — nanti otomatis ke-render begitu buildQueueInBackground dapat hasil pertama

    loading = false;
  }

  function escapeHtml(str) {
    const d = document.createElement('div'); d.textContent = str; return d.innerHTML;
  }

  function renderSlide(file) {
    const slide = document.createElement('div');
    slide.className = 'video-slide';
    slide.dataset.fileId = file.id;

    const src = `https://www.googleapis.com/drive/v3/files/${file.id}?alt=media&key=${CONFIG.API_KEY}`;

    slide.innerHTML = `
      <video data-src="${src}" loop playsinline preload="none"></video>
      <div class="tap-zone"></div>
      <div class="heart-pop">❤️</div>
      
      <div class="side-actions">
        <button class="action-btn like-btn">${likedSet.has(file.id) ? '❤️' : '🤍'}<span>Suka</span></button>
        <button class="action-btn mute-btn">${audioUnlocked ? '🔊' : '🔇'}<span>Suara</span></button>
        <button class="action-btn">↗️<span>Bagikan</span></button>
      </div>
      
      <div class="overlay">
        <div class="video-info">
          <h3>@user_${file.id.substring(0,5).toLowerCase()}</h3>
          <p>${escapeHtml(file.name)}</p>
        </div>
      </div>
    `;

    const video = slide.querySelector('video');
    video.muted = !audioUnlocked;
    const tapZone = slide.querySelector('.tap-zone');
    const likeBtn = slide.querySelector('.like-btn');
    const muteBtn = slide.querySelector('.mute-btn');
    const heartPop = slide.querySelector('.heart-pop');

    let lastTap = 0;
    tapZone.addEventListener('click', (e) => {
      const currentTime = new Date().getTime();
      const tapInterval = currentTime - lastTap;
      
      if (tapInterval < 300) {
        if (!likedSet.has(file.id)) {
          likedSet.add(file.id);
          likeBtn.innerHTML = '❤️<span>Suka</span>';
          likeBtn.classList.add('liked');
        }
        
        const rect = tapZone.getBoundingClientRect();
        heartPop.style.left = `${e.clientX - rect.left - 40}px`;
        heartPop.style.top = `${e.clientY - rect.top - 40}px`;
        heartPop.classList.remove('fade');
        heartPop.classList.add('animate');
        setTimeout(() => {
          heartPop.classList.remove('animate');
          heartPop.classList.add('fade');
        }, 500);
      } else {
        setTimeout(() => {
          if (currentTime === lastTap) { 
            // Jika video adalah iframe, play/pause via JS tidak didukung
            if(video.tagName.toLowerCase() === 'video') {
                video.paused ? video.play() : video.pause(); 
            }
          }
        }, 300);
      }
      lastTap = currentTime;
    });

    likeBtn.addEventListener('click', () => {
      const isLiked = likedSet.has(file.id);
      if (isLiked) { 
        likedSet.delete(file.id); likeBtn.innerHTML = '🤍<span>Suka</span>'; likeBtn.classList.remove('liked'); 
      } else { 
        likedSet.add(file.id); likeBtn.innerHTML = '❤️<span>Suka</span>'; likeBtn.classList.add('liked'); 
      }
    });
    
    muteBtn.addEventListener('click', () => {
      if(video.tagName.toLowerCase() === 'video') {
          video.muted = !video.muted; 
          muteBtn.innerHTML = video.muted ? '🔇<span>Bisu</span>' : '🔊<span>Suara</span>';
      }
    });

    // Jika video gagal dimuat, hapus slide ini dari feed (skip, tanpa iframe)
    video.addEventListener('error', () => {
       console.log("Video gagal dimuat, slide dilewati:", file.id);
       observer.unobserve(slide);
       preloadObserver.unobserve(slide);
       slide.remove();
    });

    feedEl.appendChild(slide);
    observer.observe(slide);
    preloadObserver.observe(slide);
  }

  // Load/unload src video hanya untuk slide aktif + 1 slide di sekitarnya,
  // supaya nggak semua video ke-request sekaligus (hemat bandwidth & API quota)
  function loadVideo(video) {
    if (!video.src && video.dataset.src) {
      video.src = video.dataset.src;
      video.load();
    }
  }
  function unloadVideo(video) {
    if (video.src) {
      video.pause();
      video.removeAttribute('src');
      video.load();
    }
  }

  const preloadObserver = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      const video = entry.target.querySelector('video');
      if (!video) return;
      if (entry.isIntersecting) {
        loadVideo(video);
      } else {
        unloadVideo(video);
      }
    });
  }, { rootMargin: '150% 0px 150% 0px', threshold: 0 });

  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      const video = entry.target.querySelector('video');
      if (!video) return;
      if (entry.isIntersecting && entry.intersectionRatio > 0.6) {
        video.play().catch(() => {});
      } else {
        video.pause();
      }
    });
    const slides = feedEl.children;
    if (slides.length > 0) {
      const lastSlide = slides[slides.length - 1];
      if (lastSlide.getBoundingClientRect().top < window.innerHeight * 2) {
        fetchVideoList();
      }
    }
  }, { threshold: [0, 0.6, 1] });

  const hasFolderId = CONFIG.FOLDER_ID && !CONFIG.FOLDER_ID.startsWith('ISI_');
  const hasFolderIds = CONFIG.FOLDER_IDS && Array.isArray(CONFIG.FOLDER_IDS) && CONFIG.FOLDER_IDS.length > 0;
  
  if (!CONFIG.API_KEY || CONFIG.API_KEY.startsWith('ISI_') || (!hasFolderId && !hasFolderIds)) {
    showStatus('⚙️ Konfigurasi belum diisi. Periksa config.js');
  } else {
    fetchVideoList();
  }
})();
</script>
</body>
</html>
